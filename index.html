<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web Development I</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-grid"></div>

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">&lt;/&gt;</div>

            <div>
                <small>WEB DEVELOPMENT I</small>
                <strong>Project Archive</strong>
            </div>
        </div>

        <div class="top-search">
            <span>⌕</span>

            <input
                id="searchInput"
                type="search"
                placeholder="Search lab or project..."
                autocomplete="off"
            >

            <kbd>Ctrl /</kbd>
        </div>
    </header>


    <main>

        <section class="archive">

            <div class="archive-heading">
                <div>
                    <p class="label">// PROJECT DATABASE</p>
                    <h1>Projects</h1>
                </div>

                <div class="archive-actions">
                    <button id="openAllBtn" type="button">Open All</button>
                    <button id="closeAllBtn" type="button">Close All</button>
                </div>
            </div>


            <div class="semester-tabs">
                <button
                    class="semester-tab active"
                    data-semester="semester1"
                    type="button"
                >
                    <span>01</span>
                    First Semester
                </button>

                <button
                    class="semester-tab"
                    data-semester="semester2"
                    type="button"
                >
                    <span>02</span>
                    Second Semester
                </button>
            </div>


            <!-- =========================================================
                 FIRST SEMESTER
            ========================================================== -->

            <section class="semester active" id="semester1">

                <div class="semester-header">
                    <div>
                        <p class="label">// SEMESTER 01</p>
                        <h2>First Semester</h2>
                    </div>

                    <span class="semester-count">0 projects</span>
                </div>


                <div class="lab-list">

                    <!--
                    =====================================================
                    COPY THIS TO ADD A NEW LABO
                    =====================================================

                    <details class="lab">
                        <summary>Labo 1</summary>

                        <div class="projects">
                            <a href="Semester_1/Labo_1/Oefening_1/index.html">
                                Oefening 1
                            </a>

                            <a href="Semester_1/Labo_1/Oefening_2/index.html">
                                Oefening 2
                            </a>
                        </div>
                    </details>

                    THAT IS ALL YOU NEED.

                    - Change "Labo 1"
                    - Change the project names
                    - Change the href links
                    - Add more <a> links if needed

                    JavaScript automatically adds:
                    - Project numbers
                    - Open buttons
                    - Code buttons
                    - Project counts
                    =====================================================
                    -->

                </div>

            </section>


            <!-- =========================================================
                 SECOND SEMESTER
            ========================================================== -->

            <section class="semester" id="semester2">

                <div class="semester-header">
                    <div>
                        <p class="label">// SEMESTER 02</p>
                        <h2>Second Semester</h2>
                    </div>

                    <span class="semester-count">0 projects</span>
                </div>


                <div class="lab-list">

                    <!--
                    =====================================================
                    COPY THIS TO ADD A NEW LABO
                    =====================================================

                    <details class="lab">
                        <summary>Labo 13</summary>

                        <div class="projects">
                            <a href="Semester_2/Labo_13/Oefening_1/index.html">
                                Oefening 1
                            </a>

                            <a href="Semester_2/Labo_13/Oefening_2/index.html">
                                Oefening 2
                            </a>
                        </div>
                    </details>

                    THAT IS ALL YOU NEED.

                    - Change "Labo 13"
                    - Change the project names
                    - Change the href links
                    - Add more <a> links if needed

                    JavaScript automatically adds everything else.
                    =====================================================
                    -->

                </div>

            </section>


            <div class="empty-state" id="emptyState" hidden>
                <strong>NO RESULTS</strong>
                <p>No matching lab or project was found.</p>
            </div>

        </section>

    </main>


    <!-- =============================================================
         SOURCE CODE VIEWER
    ============================================================== -->

    <div class="code-modal" id="codeModal" aria-hidden="true">

        <div class="modal-background" data-close-modal></div>

        <div class="code-window">

            <div class="code-window-header">

                <div class="window-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="code-title">
                    <small>SOURCE VIEWER</small>
                    <strong id="codeProjectName">Project</strong>
                </div>

                <button
                    class="close-modal"
                    type="button"
                    data-close-modal
                >
                    ×
                </button>

            </div>


            <div class="code-tabs">

                <button
                    class="code-tab active"
                    data-type="html"
                    type="button"
                >
                    HTML
                </button>

                <button
                    class="code-tab"
                    data-type="css"
                    type="button"
                >
                    CSS
                </button>

                <button
                    class="code-tab"
                    data-type="js"
                    type="button"
                >
                    JavaScript
                </button>

                <button
                    id="copyCodeBtn"
                    class="copy-code"
                    type="button"
                >
                    Copy
                </button>

            </div>


            <div
                class="code-path"
                id="codePath"
            ></div>


            <div class="code-area">

                <div
                    class="line-numbers"
                    id="lineNumbers"
                ></div>

                <pre><code id="codeDisplay"></code></pre>

            </div>

        </div>

    </div>


    <script src="code.js"></script>

</body>
</html>
